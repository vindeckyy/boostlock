[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boostlock"
version = "0.1.0"
description = "Keep CPU boost available on Linux"
readme = "README.md"
authors = [
    { name = "vindeckyy" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
boostlock = "boostlock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=boostlock --cov-report=term-missing"

[tool.coverage.run]
source = ["boostlock"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
